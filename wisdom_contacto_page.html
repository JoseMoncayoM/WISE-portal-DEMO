<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | Wisdom Academy</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --primary:#0d2b45;
      --accent:#1fb6b9;
      --light:#f5f9fc;
      --text:#1f2d3d;
      --gray:#6b7c93;
      --border:#dcebf2;
      --hover:#E6FF00;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--light);
      color:var(--text);
    }

    .container{
      width:90%;
      max-width:900px;
      margin:auto;
    }

    .navbar{
      background:white;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:100;
    }

    .nav-content{
      height:90px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
    }

    .logo img{
      height:70px;
      width:auto;
      display:block;
      transition:0.2s ease;
    }

    .logo img:hover{
      transform:scale(1.03);
    }

    .hero{
      padding:80px 0 30px;
      text-align:center;
    }

    h1{
      font-size:clamp(2rem,4vw,3rem);
      font-weight:900;
      color:var(--primary);
      margin-bottom:12px;
      line-height:1.1;
    }

    .hero p{
      color:var(--gray);
      font-size:1.05rem;
    }

    .form-box{
      background:white;
      padding:34px;
      border-radius:28px;
      border:1px solid var(--border);
      box-shadow:0 6px 18px rgba(13,43,69,0.05);
      margin-top:30px;
      margin-bottom:80px;
    }

    .form-group{
      margin-bottom:22px;
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:8px;
      color:var(--primary);
      font-size:0.92rem;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid var(--border);
      font-size:0.95rem;
      font-family:Arial, Helvetica, sans-serif;
      background:#fff;
    }

    input:focus,
    textarea:focus,
    select:focus{
      outline:none;
      border-color:var(--accent);
    }

    textarea{
      resize:none;
      height:130px;
    }

    .btn{
      padding:13px 22px;
      border-radius:999px;
      font-weight:700;
      text-decoration:none;
      border:none;
      cursor:pointer;
      transition:all 0.2s ease;
      font-family:Arial, Helvetica, sans-serif;
    }

    .btn-primary{
      background:var(--accent);
      color:white;
    }

    .btn-primary:hover{
      background:var(--hover);
      color:black;
      transform:translateY(-2px);
    }

    .form-footer{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .form-footer small{
      color:var(--gray);
    }

    @media(max-width:600px){
      .form-footer{
        flex-direction:column;
        align-items:flex-start;
      }

      .form-box{
        padding:24px;
      }

      .nav-content{
        height:80px;
      }

      .logo img{
        height:58px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="container nav-content">
      <a href="wisdom_hompage.html" class="logo">
        <img src="logo.jpg" alt="Wisdom Academy Logo">
      </a>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>CUÉNTANOS TU OBJETIVO</h1>
      <p>Queremos entender tu contexto para orientarte mejor.</p>
    </section>

    <section class="form-box">

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label>Correo</label>
        <input type="email" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" placeholder="Número de contacto">
      </div>

      <div class="form-group">
        <label>¿Qué necesitas?</label>
        <select>
          <option>Formación en inglés</option>
          <option>Interpretación</option>
          <option>Ambos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Describe tu objetivo</label>
        <textarea placeholder="Cuéntanos tu situación..."></textarea>
      </div>

      <div class="form-footer">
        <small>Te responderemos pronto.</small>
        <button class="btn btn-primary">Enviar</button>
      </div>

    </section>

  </main>

</body>
</html>
